<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث — المتحف الوطني اليمني</title>
  <meta name="description" content="بحث شامل في مجموعة المتحف الوطني اليمني.">
  <meta name="author" content="Eng. Ammar Adel Al-Masouei">
  <link rel="icon" href="assets/logos/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main id="main">
    <section class="page-hero">
      <div class="bg-pattern"></div>
      <div class="container-main">
        <h1><i class="fa-solid fa-magnifying-glass"></i> البحث في المتحف</h1>
        <p>ابحث بالاسم، الحضارة، المحافظة، القرن، القسم، المادة، القاعة، أو الدور.</p>
        <nav class="breadcrumb-nav" aria-label="مسار التنقل">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <span>البحث</span>
        </nav>
      </div>
    </section>

    <section class="container-main py-4">
      <div class="search-box-lux mb-4">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" class="search-input-lg" type="search" placeholder="ابحث عن قطعة، حضارة، مادة، موقع اكتشاف..." autofocus>
      </div>

      <div class="filter-bar mb-4">
        <div class="filter-grid">
          <div class="form-field">
            <label for="sCat">القسم</label>
            <select id="sCat"></select>
          </div>
          <div class="form-field">
            <label for="sCiv">الحضارة</label>
            <select id="sCiv"></select>
          </div>
          <div class="form-field">
            <label for="sProv">المحافظة</label>
            <select id="sProv"></select>
          </div>
          <div class="form-field">
            <label for="sFloor">الدور</label>
            <select id="sFloor"></select>
          </div>
          <div class="form-field">
            <label for="sMat">المادة</label>
            <select id="sMat"></select>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="muted-text">نتائج البحث: <strong id="resultCount">0</strong></span>
        <span class="badge-lux badge-gold" id="searchMode">بحث شامل</span>
      </div>
      <div id="searchResults">
        <div class="cards-grid">
          <div class="skeleton" style="height:320px"></div>
          <div class="skeleton" style="height:320px"></div>
          <div class="skeleton" style="height:320px"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
