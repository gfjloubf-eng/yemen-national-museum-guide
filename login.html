<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — المتحف الوطني اليمني</title>
  <meta name="description" content="تسجيل الدخول إلى دليل المتحف الوطني اليمني للزوار والباحثين والإدارة.">
  <meta name="author" content="Eng. Ammar Adel Al-Masouei">
  <link rel="icon" href="assets/logos/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main id="main">
    <section class="page-hero" style="min-height:auto;padding:2.5rem 0">
      <div class="bg-pattern"></div>
      <div class="container-main">
        <h1><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</h1>
        <p>الدخول إلى حسابك في دليل المتحف الوطني اليمني.</p>
      </div>
    </section>

    <section class="container-main">
      <div class="auth-wrap">
        <div class="auth-card">
          <div class="text-center mb-4">
            <span class="brand-logo" style="margin:0 auto;width:64px;height:64px;font-size:1.8rem"><i class="fa-solid fa-landmark-dome"></i></span>
            <h3 class="mt-2">المتحف الوطني اليمني</h3>
          </div>
          <div class="auth-tabs">
            <button class="active" data-auth-tab="login">تسجيل الدخول</button>
            <button data-auth-tab="register">مستخدم جديد</button>
          </div>
          <div data-pane="login">
            <div class="form-field mb-3">
              <label for="loginUser">اسم المستخدم</label>
              <input id="loginUser" type="text" placeholder="اسم المستخدم" autocomplete="username">
            </div>
            <div class="form-field mb-3">
              <label for="loginPass">كلمة المرور</label>
              <input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
            </div>
            <button class="btn btn-bronze btn-block" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
            <p class="muted-text text-center mt-3 small" id="loginError"></p>
            <div class="mt-3">
              <p class="muted-text small text-center">حسابات تجريبية:</p>
              <div class="d-flex flex-wrap gap-2 justify-content-center">
                <code class="demo-cred" data-demo="admin">مدير: admin / admin123</code>
                <code class="demo-cred" data-demo="researcher">باحث: researcher / res123</code>
                <code class="demo-cred" data-demo="visitor">زائر: visitor / vis123</code>
              </div>
            </div>
          </div>
          <div data-pane="register" style="display:none">
            <p class="muted-text text-center">يمكنك التسجيل كزائر للاستفادة من خاصية المفضلة والملاحظات البحثية.</p>
            <div class="form-field mb-3">
              <label for="regUser">اسم المستخدم</label>
              <input id="regUser" type="text" placeholder="اختر اسماً للمستخدم">
            </div>
            <div class="form-field mb-3">
              <label for="regPass">كلمة المرور</label>
              <input id="regPass" type="password" placeholder="كلمة المرور">
            </div>
            <button class="btn btn-gold btn-block" id="registerBtn"><i class="fa-solid fa-user-plus"></i> تسجيل</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
