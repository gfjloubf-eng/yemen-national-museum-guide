<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المعروضات — المتحف الوطني اليمني</title>
  <meta name="description" content="تصفح مجموعة المتحف الوطني اليمني من القطع الأثرية مع فلاتر متقدمة.">
  <meta name="author" content="Eng. Ammar Adel Al-Masouei">
  <link rel="icon" href="assets/logos/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main id="main">
    <section class="page-hero">
      <div class="bg-pattern"></div>
      <div class="container-main">
        <h1><i class="fa-solid fa-vault"></i> المعروضات</h1>
        <p>تصفح كنوز المتحف الوطني اليمني واستخدم الفلاتر للوصول إلى ما تبحث عنه.</p>
        <nav class="breadcrumb-nav" aria-label="مسار التنقل">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <span>المعروضات</span>
        </nav>
      </div>
    </section>

    <section class="container-main py-4">
      <div class="filter-bar mb-4">
        <div class="filter-grid">
          <div class="form-field">
            <label for="filterSearch">بحث نصي</label>
            <input id="filterSearch" type="search" placeholder="اسم، وصف...">
          </div>
          <div class="form-field">
            <label for="fCat">القسم</label>
            <select id="fCat"></select>
          </div>
          <div class="form-field">
            <label for="fCiv">الحضارة</label>
            <select id="fCiv"></select>
          </div>
          <div class="form-field">
            <label for="fEra">العصر</label>
            <select id="fEra"></select>
          </div>
          <div class="form-field">
            <label for="fFloor">الدور</label>
            <select id="fFloor"></select>
          </div>
          <div class="form-field">
            <label for="fProv">المحافظة</label>
            <select id="fProv"></select>
          </div>
          <div class="form-field">
            <label for="fMat">المادة</label>
            <select id="fMat"></select>
          </div>
          <div class="form-field">
            <label for="fSort">ترتيب</label>
            <select id="fSort">
              <option value="">الأحدث</option>
              <option value="name">الاسم</option>
              <option value="floor">الدور</option>
            </select>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
          <span class="muted-text"><strong id="filterCount">0</strong> معروضاً</span>
          <button class="btn btn-ghost btn-sm" id="clearFilters"><i class="fa-solid fa-rotate-left"></i> مسح الفلاتر</button>
        </div>
      </div>

      <div id="exhibitsGrid">
        <div class="cards-grid">
          <div class="skeleton" style="height:320px"></div>
          <div class="skeleton" style="height:320px"></div>
          <div class="skeleton" style="height:320px"></div>
          <div class="skeleton" style="height:320px"></div>
          <div class="skeleton" style="height:320px"></div>
          <div class="skeleton" style="height:320px"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/filter.js"></script>
</body>
</html>
